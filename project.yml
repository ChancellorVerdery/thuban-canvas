name: ThubanCanvas
options:
  bundleIdPrefix: com.thuban
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
packages:
  ThubanCanvasCore:
    path: Packages/ThubanCanvasCore
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ThubanCanvas:
    type: application
    platform: macOS
    sources:
      - path: ThubanCanvas/App
      - path: ThubanCanvas/Views
      - path: ThubanCanvas/Web
      - path: ThubanCanvas/MenuBar
      - path: ThubanCanvas/Resources/Assets.xcassets
      - path: ThubanCanvas/Resources/web
        type: folder
    dependencies:
      - package: ThubanCanvasCore
    info:
      path: ThubanCanvas/Resources/Info.plist
      properties:
        CFBundleName: Thuban Canvas
        CFBundleDisplayName: Thuban Canvas
        CFBundleIdentifier: com.thuban.canvas
        LSMinimumSystemVersion: "15.0"
        LSApplicationCategoryType: public.app-category.education
        NSHumanReadableCopyright: "© 2026 Chancellor Verdery"
        NSPrincipalClass: NSApplication
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
        NSUserNotificationAlertStyle: alert
    entitlements:
      path: ThubanCanvas/Resources/ThubanCanvas.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thuban.canvas
        PRODUCT_NAME: Thuban Canvas
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: false
