name: ThubanCanvas
options:
  bundleIdPrefix: com.thuban
  deploymentTarget:
    macOS: "15.0"
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
packages:
  ThubanCanvasCore:
    path: Packages/ThubanCanvasCore
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ThubanCanvas:
    type: application
    platform: macOS
    sources:
      - path: ThubanCanvas/App
      - path: ThubanCanvas/Views
      - path: ThubanCanvas/Web
      - path: ThubanCanvas/MenuBar
      - path: ThubanCanvas/Resources/Assets.xcassets
      - path: ThubanCanvas/Resources/web
        type: folder
    dependencies:
      - package: ThubanCanvasCore
    info:
      path: ThubanCanvas/Resources/Info.plist
      properties:
        CFBundleName: Thuban Canvas
        CFBundleDisplayName: Thuban Canvas
        CFBundleIdentifier: com.thuban.canvas
        LSMinimumSystemVersion: "15.0"
        LSApplicationCategoryType: public.app-category.education
        NSHumanReadableCopyright: "© 2026 Chancellor Verdery"
        NSPrincipalClass: NSApplication
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
        NSUserNotificationAlertStyle: alert
    entitlements:
      path: ThubanCanvas/Resources/ThubanCanvas.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thuban.canvas
        PRODUCT_NAME: Thuban Canvas
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: false
  CanvasiOS:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: CanvasiOS
        excludes:
          - "Resources/Info.plist"
      # Platform-neutral code shared with the Mac target (see ARCHITECTURE.md → iOS).
      - path: ThubanCanvas/App/Resource.swift
      - path: ThubanCanvas/App/CourseSession.swift
      - path: ThubanCanvas/App/Routes.swift
      - path: ThubanCanvas/Views/Theme/ThemeEnvironment.swift
      - path: ThubanCanvas/Views/Components/AppArt.swift
      - path: ThubanCanvas/Views/Components/AppArtSource.swift
      - path: ThubanCanvas/Views/Calendar/CalendarModel.swift
      - path: ThubanCanvas/Web/CanvasSchemeHandler.swift
      - path: ThubanCanvas/Web/CanvasHTMLDocument.swift
    dependencies:
      - package: ThubanCanvasCore
    info:
      path: CanvasiOS/Resources/Info.plist
      properties:
        CFBundleName: Thuban Canvas
        CFBundleDisplayName: Thuban Canvas
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.education
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSHumanReadableCopyright: "© 2026 Chancellor Verdery"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.thuban.canvas.ios
        PRODUCT_NAME: Thuban Canvas
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: false
        CODE_SIGN_STYLE: Automatic
        "CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]": NO
        "CODE_SIGNING_REQUIRED[sdk=iphonesimulator*]": NO
        ENABLE_PREVIEWS: YES
